# 在 GitHub 托管的干净环境里构建「已签名 release APK」+ 自动发布 Release。
# 触发：推送 v* 标签，或手动在 Actions 页面运行。
# Release 资产：CI 构建的最新 APK + release/ 目录预置的 Windows 安装包。
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 两种签名来源（二选一）：
      #  1) 仓库 Settings → Secrets 配置了 KEYSTORE_BASE64 等 → 用密钥解密还原；
      #  2) 未配置 Secrets，但仓库已提交 campus_release.keystore + keystore.properties → 直接使用。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > campus_release.keystore
            printf 'STORE_FILE=campus_release.keystore\nSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
              "${{ secrets.KEY_STORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties
            echo "使用 Secrets 中的签名密钥。"
          elif [ -f campus_release.keystore ]; then
            echo "使用仓库内已提交的签名密钥。"
          else
            echo "::error::未找到签名密钥：请配置 Secrets 或在仓库提交 campus_release.keystore"
            exit 1
          fi

      - name: Build signed release APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleRelease

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            release/Autologin_v1.1.0_x64_setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
